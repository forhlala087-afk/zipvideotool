<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>批次影片打包 ZIP 工具</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { max-width: 720px; margin: 40px auto; padding: 0 20px; background: #f5f7fa; color: #333; }
    h1 { font-size: 1.5rem; margin-bottom: 16px; }
    .drop-zone {
      border: 2px dashed #4a90e2;
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      background: #fff;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    .drop-zone.dragover { background: #e8f2fc; border-color: #2c6cb0; }
    .drop-zone p { margin: 8px 0 0; color: #666; font-size: 0.9rem; }
    input[type="file"] { display: none; }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      flex-wrap: wrap;
      align-items: center;
    }
    .controls input[type="text"] {
      flex: 1;
      min-width: 180px;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #4a90e2; color: #fff; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .file-list {
      margin-top: 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      overflow: hidden;
    }
    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #eee;
      font-size: 0.9rem;
    }
    .file-item:last-child { border-bottom: none; }
    .file-info { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 12px; }
    .file-size { color: #888; font-size: 0.85rem; margin-left: 8px; }
    .remove-btn {
      background: transparent;
      color: #999;
      padding: 4px 8px;
      font-size: 1rem;
    }
    .remove-btn:hover { color: #e74c3c; }
    .summary { margin-top: 12px; font-size: 0.9rem; color: #555; }
    .progress-wrap {
      margin-top: 16px;
      display: none;
    }
    progress { width: 100%; height: 20px; }
    .status-text { font-size: 0.85rem; color: #555; margin-top: 4px; text-align: right; }
  </style>
</head>
<body>

  <h1>批次影片打包 ZIP 工具</h1>

  <div class="drop-zone" id="dropZone">
    <strong>點擊選擇影片，或直接將多個影片拖曳到此處</strong>
    <p>支援 MP4、MOV、MKV、WebM 等影片格式（全程本機處理，不上傳雲端）</p>
    <input type="file" id="fileInput" accept="video/*" multiple>
  </div>

  <div class="controls">
    <input type="text" id="zipName" value="videos.zip" placeholder="輸出檔名 (例如 videos.zip)">
    <button class="btn-danger" id="clearBtn" disabled>清空列表</button>
    <button class="btn-primary" id="zipBtn" disabled>打包並下載 ZIP</button>
  </div>

  <div class="progress-wrap" id="progressWrap">
    <progress id="progressBar" value="0" max="100"></progress>
    <div class="status-text" id="statusText">準備中...</div>
  </div>

  <div class="summary" id="summary"></div>
  <div class="file-list" id="fileList"></div>

  <script>
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileListEl = document.getElementById('fileList');
    const summaryEl = document.getElementById('summary');
    const zipBtn = document.getElementById('zipBtn');
    const clearBtn = document.getElementById('clearBtn');
    const zipNameInput = document.getElementById('zipName');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const statusText = document.getElementById('statusText');

    let selectedFiles = [];

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(1024));
      return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + units[i];
    }

    function addFiles(files) {
      for (const file of files) {
        if (!file.type.startsWith('video/')) continue;
        // 避免重複加入完全相同的檔案
        const exists = selectedFiles.some(f => f.name === file.name && f.size === file.size);
        if (!exists) selectedFiles.push(file);
      }
      renderList();
    }

    function renderList() {
      fileListEl.innerHTML = '';
      if (selectedFiles.length === 0) {
        summaryEl.textContent = '';
        zipBtn.disabled = true;
        clearBtn.disabled = true;
        return;
      }

      let totalSize = 0;
      selectedFiles.forEach((file, index) => {
        totalSize += file.size;
        const item = document.createElement('div');
        item.className = 'file-item';
        item.innerHTML = `
          <div class="file-info">
            <span>${file.name}</span>
            <span class="file-size">(${formatSize(file.size)})</span>
          </div>
          <button class="remove-btn" data-index="${index}" title="移除">✕</button>
        `;
        fileListEl.appendChild(item);
      });

      summaryEl.textContent = `已選擇 ${selectedFiles.length} 個影片，總大小約 ${formatSize(totalSize)}`;
      zipBtn.disabled = false;
      clearBtn.disabled = false;

      document.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const idx = Number(e.target.dataset.index);
          selectedFiles.splice(idx, 1);
          renderList();
        });
      });
    }

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => {
      addFiles(e.target.files);
      fileInput.value = '';
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      addFiles(e.dataTransfer.files);
    });

    clearBtn.addEventListener('click', () => {
      selectedFiles = [];
      renderList();
    });

    zipBtn.addEventListener('click', async () => {
      if (selectedFiles.length === 0) return;

      zipBtn.disabled = true;
      clearBtn.disabled = true;
      progressWrap.style.display = 'block';
      progressBar.value = 0;
      statusText.textContent = '正在讀取並打包影片...';

      try {
        const zip = new JSZip();
        const usedNames = new Set();

        selectedFiles.forEach(file => {
          let fileName = file.name;
          // 處理同名檔案衝突
          if (usedNames.has(fileName)) {
            const dotIdx = fileName.lastIndexOf('.');
            const base = dotIdx !== -1 ? fileName.slice(0, dotIdx) : fileName;
            const ext = dotIdx !== -1 ? fileName.slice(dotIdx) : '';
            let counter = 1;
            while (usedNames.has(`${base}_${counter}${ext}`)) counter++;
            fileName = `${base}_${counter}${ext}`;
          }
          usedNames.add(fileName);
          zip.file(fileName, file);
        });

        const blob = await zip.generateAsync(
          { type: 'blob', compression: 'STORE' },
          (metadata) => {
            const percent = metadata.percent.toFixed(1);
            progressBar.value = metadata.percent;
            statusText.textContent = `打包進度：${percent}%`;
          }
        );

        let outputName = zipNameInput.value.trim() || 'videos.zip';
        if (!outputName.toLowerCase().endsWith('.zip')) outputName += '.zip';

        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = outputName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusText.textContent = '打包完成，已開始下載！';
      } catch (err) {
        alert('打包失敗：' + err.message);
        statusText.textContent = '打包失敗（可能是影片總容量超過瀏覽器記憶體上限）';
      } finally {
        zipBtn.disabled = false;
        clearBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
